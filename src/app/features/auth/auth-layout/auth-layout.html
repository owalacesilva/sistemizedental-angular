<div class="flex min-h-dvh flex-col lg:flex-row">
  <!-- Brand panel -->
  <aside
    class="from-brand-900 via-brand-800 to-brand-600 relative hidden overflow-hidden bg-gradient-to-br lg:flex lg:w-[46%] xl:w-[42%]"
  >
    <div
      class="bg-brand-400/25 pointer-events-none absolute -top-24 -right-24 h-96 w-96 rounded-full blur-3xl"
      aria-hidden="true"
    ></div>
    <div
      class="bg-brand-200/20 pointer-events-none absolute -bottom-32 -left-20 h-96 w-96 rounded-full blur-3xl"
      aria-hidden="true"
    ></div>

    <div class="relative flex w-full flex-col justify-between p-10 xl:p-14">
      <app-logo tone="inverted" />

      <div class="max-w-md">
        <h2 class="text-3xl font-semibold tracking-tight text-white xl:text-4xl">
          {{ t('auth.brand.headline') }}
        </h2>
        <p class="text-brand-100 mt-4 text-base leading-relaxed">{{ t('auth.brand.body') }}</p>

        <ul class="mt-10 space-y-4">
          @for (feature of featureKeys; track feature) {
            <li class="text-brand-50 flex items-start gap-3 text-sm">
              <span
                class="bg-brand-400/25 text-brand-100 mt-0.5 inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full"
              >
                <svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    fill-rule="evenodd"
                    d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z"
                    clip-rule="evenodd"
                  />
                </svg>
              </span>
              {{ t(feature) }}
            </li>
          }
        </ul>
      </div>

      <p class="text-brand-200/80 text-xs">{{ t('auth.brand.rights', { year: year }) }}</p>
    </div>
  </aside>

  <!-- Form panel -->
  <main class="flex flex-1 items-center justify-center px-5 py-10 sm:px-8">
    <div class="w-full max-w-md">
      <div class="mb-8 flex items-center justify-between gap-4">
        <span class="lg:invisible">
          <app-logo />
        </span>
        <app-locale-switcher />
      </div>

      <header class="mb-7">
        <h1 class="text-brand-900 text-2xl font-semibold tracking-tight sm:text-3xl">
          {{ heading() }}
        </h1>
        <p class="mt-2 text-sm text-slate-500">{{ subheading() }}</p>
      </header>

      <ng-content />
    </div>
  </main>
</div>
