<div class="min-h-dvh lg:flex">
  <!-- Mobile scrim -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-sm lg:hidden"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar -->
  <aside
    class="bg-brand-900 fixed inset-y-0 left-0 z-40 flex w-64 shrink-0 flex-col transition-transform duration-200 lg:static lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="border-brand-800/60 flex h-16 items-center border-b px-5">
      <app-logo tone="inverted" />
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4" aria-label="Main">
      @for (item of navItems; track item.route) {
        @if (item.comingSoon) {
          <span
            class="text-brand-200/50 flex cursor-not-allowed items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium"
            [attr.aria-disabled]="true"
          >
            <svg
              class="h-5 w-5 shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
            </svg>
            <span class="flex-1">{{ item.label }}</span>
            <span
              class="bg-brand-800 text-brand-300 rounded px-1.5 py-0.5 text-[10px] font-semibold"
            >
              SOON
            </span>
          </span>
        } @else {
          <a
            class="text-brand-100 hover:bg-brand-800 flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:text-white"
            [routerLink]="item.route"
            routerLinkActive="bg-brand-600 text-white hover:bg-brand-600"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="closeSidebar()"
          >
            <svg
              class="h-5 w-5 shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
            </svg>
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="border-brand-800/60 border-t p-4">
      <div class="bg-brand-800/60 rounded-xl p-3.5">
        <p class="text-sm font-semibold text-white">Trial active</p>
        <p class="text-brand-200 mt-1 text-xs leading-relaxed">
          You're exploring the refreshed Sistemize Dental. Legacy screens are being ported.
        </p>
      </div>
    </div>
  </aside>

  <!-- Main column -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/85 px-4 backdrop-blur sm:px-6"
    >
      <button
        type="button"
        class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 lg:hidden"
        (click)="toggleSidebar()"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="sidebarOpen()"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="relative hidden max-w-sm flex-1 sm:block">
        <svg
          class="pointer-events-none absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
          />
        </svg>
        <input
          type="search"
          class="focus:border-brand-400 focus:ring-brand-400/30 w-full rounded-lg border border-slate-200 bg-slate-50 py-2 pr-3 pl-9 text-sm transition placeholder:text-slate-400 focus:bg-white focus:ring-2"
          placeholder="Search patients, appointments…"
          aria-label="Search"
        />
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button
          type="button"
          class="relative rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
          aria-label="Notifications"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"
            />
          </svg>
          <span class="bg-brand-400 absolute top-1.5 right-1.5 h-2 w-2 rounded-full"></span>
        </button>

        <div class="relative">
          <button
            type="button"
            class="flex items-center gap-2.5 rounded-lg py-1.5 pr-2 pl-1.5 transition hover:bg-slate-100"
            (click)="toggleUserMenu()"
            [attr.aria-expanded]="userMenuOpen()"
            aria-haspopup="menu"
          >
            <app-avatar [name]="displayName() || 'Account'" />
            <span class="hidden text-left sm:block">
              <span class="block text-sm leading-tight font-semibold text-slate-800">
                {{ displayName() || 'Account' }}
              </span>
              <span class="block text-xs leading-tight text-slate-500">
                {{ account()?.email || 'Signed in' }}
              </span>
            </span>
            <svg
              class="h-4 w-4 text-slate-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          @if (userMenuOpen()) {
            <div
              class="absolute right-0 z-30 mt-2 w-52 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
              role="menu"
            >
              <button
                type="button"
                class="flex w-full items-center gap-2.5 px-4 py-2.5 text-left text-sm text-rose-600 transition hover:bg-rose-50"
                (click)="logout()"
                role="menuitem"
              >
                <svg
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  />
                </svg>
                Sign out
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </main>
  </div>
</div>
