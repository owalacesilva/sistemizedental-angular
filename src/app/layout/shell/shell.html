<div class="min-h-dvh lg:flex">
  <!-- Drawer scrim, phones only -->
  @if (drawerOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 cursor-default bg-slate-900/40 backdrop-blur-sm lg:hidden"
      (click)="closeDrawer()"
      [attr.aria-label]="t('shell.closeSidebar')"
      tabindex="-1"
    ></button>
  }

  <app-sidebar />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar />

    <main class="flex-1 px-3 py-4 sm:px-4 lg:px-6">
      <router-outlet />
    </main>
  </div>

  <app-global-search />
</div>
