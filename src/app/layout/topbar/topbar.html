<header
  class="sticky top-0 z-20 flex h-12 items-center gap-2 border-b border-slate-200 bg-white/85 px-3 backdrop-blur sm:px-4"
>
  <!-- Drawer toggle, phones only -->
  <button
    type="button"
    class="app-btn-icon lg:hidden"
    (click)="toggleSidebar()"
    [attr.aria-label]="t('shell.openSidebar')"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Rail toggle, docked sidebar only -->
  <button
    type="button"
    class="app-btn-icon hidden lg:inline-flex"
    (click)="toggleCollapsed()"
    [attr.aria-pressed]="collapsed()"
    [attr.aria-label]="collapsed() ? t('shell.expandSidebar') : t('shell.collapseSidebar')"
    [attr.title]="collapsed() ? t('shell.expandSidebar') : t('shell.collapseSidebar')"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.7"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm5.5-2v16"
      />
    </svg>
  </button>

  <!-- Search: a button, not an input — the palette owns the field -->
  <button
    type="button"
    class="flex min-w-0 flex-1 items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-left text-sm text-slate-400 transition hover:border-slate-300 hover:bg-white sm:max-w-sm"
    (click)="openSearch()"
    [attr.aria-label]="t('search.open')"
  >
    <svg
      class="h-4 w-4 shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
      />
    </svg>
    <span class="min-w-0 flex-1 truncate">{{ t('search.trigger') }}</span>
    <kbd
      class="hidden rounded border border-slate-200 bg-white px-1.5 py-0.5 text-[10px] font-medium text-slate-400 sm:block"
    >
      {{ shortcutHint }}
    </kbd>
  </button>

  <div class="ml-auto flex items-center gap-1.5">
    <app-locale-switcher />

    <button
      type="button"
      class="app-btn-icon relative"
      [attr.aria-label]="t('shell.notifications')"
    >
      <svg
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"
        />
      </svg>
      <span class="bg-brand-400 absolute top-1 right-1 h-1.5 w-1.5 rounded-full"></span>
    </button>

    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg py-1 pr-1.5 pl-1 transition hover:bg-slate-100"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="userMenuOpen()"
        [attr.aria-label]="t('shell.accountMenu')"
        aria-haspopup="menu"
      >
        <app-avatar [name]="displayName() || t('shell.account')" sizeClass="h-7 w-7 text-[11px]" />
        <span class="hidden text-left sm:block">
          <span class="block text-xs leading-tight font-semibold text-slate-800">
            {{ displayName() || t('shell.account') }}
          </span>
          <span class="block text-[11px] leading-tight text-slate-500">
            {{ account()?.email || t('shell.signedIn') }}
          </span>
        </span>
        <svg
          class="h-3.5 w-3.5 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      @if (userMenuOpen()) {
        <div
          class="absolute right-0 z-30 mt-1.5 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
          role="menu"
        >
          <button
            type="button"
            class="flex w-full items-center gap-2 px-3.5 py-2 text-left text-sm text-rose-600 transition hover:bg-rose-50"
            (click)="logout()"
            role="menuitem"
          >
            <svg
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
            {{ t('shell.signOut') }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
